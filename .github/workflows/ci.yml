name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  # Offline suites: DSH plugin contract, MCP handshake/tools-list, CLI flags and
  # exit codes. No network, fast, runs on every push and PR.
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: DSH plugin contract (offline)
        run: node test/selftest.mjs --offline
      - name: MCP server handshake (offline)
        run: node test/mcp-test.mjs --offline
      - name: CLI surface (offline)
        run: node test/cli-test.mjs --offline
      - name: Checked-in schemas are up to date
        run: |
          node tools/export-schemas.mjs
          git diff --exit-code -- schema/

  # Live tests against the real upstream APIs (Open-Meteo), through all three
  # surfaces. Network-dependent, so it runs on main, schedule and manual dispatch.
  live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: DSH tool definitions (live)
        run: node test/selftest.mjs
      - name: MCP server (live)
        run: node test/mcp-test.mjs
      - name: CLI (live)
        run: node test/cli-test.mjs
